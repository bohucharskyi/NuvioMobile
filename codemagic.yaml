workflows:
  ios-testflight:
    name: Nuvio iOS Full (Internal TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: footybite_asc
    environment:
      xcode: "27.1"
      java: 17
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bohucharskyi.nuvio
      vars:
        XCODE_PROJECT: iosApp/iosApp.xcodeproj
        XCODE_SCHEME: iosApp
        APPLE_TEAM_ID: HNXK696QY2
        BUNDLE_ID: com.bohucharskyi.nuvio
        CM_RECURSIVE_SUBMODULE_INIT: "false"
        NUVIO_IOS_DISTRIBUTION: testflight
        GRADLE_OPTS: -Dfile.encoding=UTF-8
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.konan
    scripts:
      - name: Prepare upstream iOS dependencies
        script: |
          set -euo pipefail
          xcodebuild -version
          java -version
          sysctl -n hw.memsize
          # Gradle validates the local.properties input even without service keys.
          touch local.properties
          ./scripts/prepare-ios-dependencies.sh
          python3 scripts/bundle-ios-testflight-providers.py
      - name: Configure Xcode for TestFlight
        script: |
          set -euo pipefail
          project="$XCODE_PROJECT/project.pbxproj"
          sed -i '' -E \
            -e "s/DEVELOPMENT_TEAM = 8QBDZ766S3;/DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/" \
            -e "s/PRODUCT_BUNDLE_IDENTIFIER = com\.nuvio\.(app|media);/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" \
            -e "s/PRODUCT_BUNDLE_IDENTIFIER = com\.nuvio\.(app|media)\.DownloadsWidgetExtension;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID.DownloadsWidgetExtension;/" \
            "$project"

          # Command-line settings override Codemagic's runner-level Gradle defaults.
          gradle_task=':composeApp:embedAndSignAppleFrameworkForXcode'
          grep -Fq "./gradlew $gradle_task" "$project"
          sed -i '' "s|\./gradlew $gradle_task|./gradlew -Dorg.gradle.jvmargs=-Xmx8192M -Pkotlin.native.jvmArgs=-Xmx8192M -Pkotlin.daemon.jvmargs=-Xmx1536M --max-workers=2 -I .codemagic-heap.gradle $gradle_task|" "$project"
          cat > .codemagic-heap.gradle <<'GRADLE'
          gradle.settingsEvaluated {
              def heapMiB = Runtime.getRuntime().maxMemory().intdiv(1024 * 1024)
              println("Gradle JVM maximum heap: ${heapMiB} MiB")
              if (heapMiB < 7680) {
                  throw new GradleException("Kotlin/Native requires the configured 8 GiB Gradle heap.")
              }
          }
          GRADLE

          # Apple's marketing version accepts only numbers and periods.
          version_file=iosApp/Configuration/Version.xcconfig
          version=$(sed -nE 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "$version_file")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'CURRENT_PROJECT_VERSION=%s\nMARKETING_VERSION=%s\n' \
            "$PROJECT_BUILD_NUMBER" "$version" > "$version_file"
      - name: Apply the app and widget signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --custom-export-options='{"testFlightInternalTestingOnly": true, "manageAppVersionAndBuildNumber": false}'
      - name: Archive and export the signed iPhone build
        script: |
          set -euo pipefail
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" \
            --config Release --disable-xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
